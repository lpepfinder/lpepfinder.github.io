# Build the site with the latest index bundle (index.yml) and publish it to GitHub Pages (docs/ci.md).
# A push rebuilds the index only when the code that shapes it changed; Refresh builds it once a day.
name: Deploy

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # is e2e/quality.js still savoir's latest gate? A warning, never a red pipeline (npm run gate:update adopts it)
  gate:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: npm run gate:check

  # is the index bundle in the "data" release built by the code being deployed? (scripts/ci/index-key.js)
  check:
    runs-on: ubuntu-24.04
    outputs:
      stale: ${{ steps.key.outputs.stale }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: key
        run: |
          want=$(node scripts/ci/index-key.js)
          have=$(gh release download data --pattern index-manifest.json -O - 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0)).key" 2>/dev/null || echo none)
          echo "index code $want, bundle built with $have"
          echo "stale=$([ "$want" = "$have" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  # only when the code that shapes the index changed (or there is no bundle yet): build it once, here
  index:
    needs: check
    if: needs.check.outputs.stale == 'true'
    uses: ./.github/workflows/index.yml
    permissions:
      contents: write

  build:
    needs: [check, index]
    # index skipped (bundle up to date) is fine; index failed is not
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.index.result != 'failure' }}
    runs-on: ubuntu-24.04
    # write: the health history in the "data" release; issues: the health report
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # the latest code, not the commit that started the run: a refresh runs for hours, fixes land meanwhile
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the index bundle (index.yml): the search index, watch files, Dig crates and the crawl files the pages read.
      # No bundle = no deploy, so the live site is never replaced by an empty one.
      - name: Index bundle
        run: |
          gh release download data --pattern index.tar.gz
          tar xzf index.tar.gz
          rm index.tar.gz
      - run: npm run validate && npm run rates
      # artist profiles (Refresh's enrich job, docs/sources.md): not part of the index cache, always the latest
      - name: Artist profiles
        run: |
          mkdir -p generated/enrich
          gh release download data --pattern enrich.json.gz -O - | gunzip > generated/enrich/artists.json || { echo "no profiles yet"; rm -f generated/enrich/artists.json; }
      # the collectors feed (Refresh's social job, docs/feed.md), served as /social.json
      - name: Collectors feed
        run: gh release download data --pattern social.json.gz -O - | gunzip > public/social.json || { echo "no feed yet"; rm -f public/social.json; }
      - run: npx astro build
      # GitHub Pages sites may be 1 GB: stop at 900 MB so a growth spike never takes the site down
      - name: Size budget
        run: |
          du -sm --apparent-size dist dist/search dist/w dist/new dist/feed 2>/dev/null || true
          test "$(du -sm --apparent-size dist | cut -f1)" -le 900
      # the built site in a browser, as readers use it: a failing test stops here, the live site keeps the previous build
      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        id: e2e
        run: npm run test:e2e
      - name: Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
      # health report: today's numbers against the last build of an earlier day (history: health.json in the
      # "data" release); one issue labelled "health" opened or updated while degraded, closed once healthy.
      # Also after a failed step (a failed test is reported), and never a reason to hold the deploy back.
      - name: Health report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release download data --pattern health.json --dir generated --clobber || echo "no health history yet"
          # the numbers are saved even when the issue can't be updated
          npm run health -- --history generated/health.json --issue || status=$?
          if [ -f generated/health.json ]; then gh release upload data generated/health.json --clobber; fi
          exit "${status:-0}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # explicit: a skipped index job upstream would otherwise skip this one too
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # a large site (search index + watchlist files) can take GitHub Pages over 10 min to publish
          timeout: 1800000

# Build the search index and the Astro site from the latest crawl data, publish to GitHub Pages.
name: Deploy

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # no crawl data yet = no deploy, so the live site is never replaced by an empty one
      - name: Crawl data
        run: |
          gh release download data --pattern generated.tar.gz && tar xzf generated.tar.gz
          # site crawler shards (only those of the current shard count)
          for k in $(node -p "[...Array(require('./data/config.json').site.shards).keys()].join(' ')"); do
            gh release download data --pattern "site-$k.tar.gz" --clobber && tar xzf "site-$k.tar.gz" || echo "no site-$k.tar.gz yet"
          done
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

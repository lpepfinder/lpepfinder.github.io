# Build the search index and the Astro site from the latest crawl data, publish to GitHub Pages.
name: Deploy

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # write: the build updates the offer ledger in the "data" release; issues: the health report
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # the offer ledger holds millions of rows in memory next to the catalog
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      # the latest code, not the commit that started the run: a refresh runs for hours, fixes land meanwhile
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # no crawl data yet = no deploy, so the live site is never replaced by an empty one
      - name: Crawl data
        run: |
          gh release download data --pattern generated.tar.gz && tar xzf generated.tar.gz
          # site crawler shards (only those of the current shard count)
          for k in $(node -p "[...Array(require('./data/config.json').site.shards).keys()].join(' ')"); do
            gh release download data --pattern "site-$k.tar.gz" --clobber && tar xzf "site-$k.tar.gz" || echo "no site-$k.tar.gz yet"
          done
      # The search index, watchlist files and Dig crates take ~20 minutes to build from millions of offers: they are
      # cached, keyed by the crawl data (its upload times in the "data" release) and by everything that shapes them
      # (indexing code, shops, settings). A push that changes neither reuses them; new crawl data rebuilds them.
      - name: Index key
        run: |
          gh release view data --json assets --jq '[.assets[] | select(.name | test("^(generated|site-[0-9]+)[.]tar[.]gz$")) | .name + "@" + .updatedAt] | sort | join(",")' > .index-data-id
          cat .index-data-id
      - name: Index cache
        id: index-cache
        uses: actions/cache@v4
        with:
          path: |
            public/search
            public/w
            public/dig.json
            public/regions.json
            generated/site-data.json
            generated/new-arrivals.json
            generated/quality-report.json
          key: index-${{ hashFiles('.index-data-id', 'scripts/index/**', 'scripts/ledger/**', 'scripts/quality/**', 'scripts/lib/**', 'scripts/platforms/filter.js', 'src/lib/search/**', 'src/lib/watch/catno.js', 'data/config.json', 'data/release-key.json', 'data/facets.json', 'data/regions.json', 'data/rates.json', 'data/shops/**') }}
      - run: npm run validate && npm run rates
      # offer ledger: today's state and the one before it (a second build on the same day starts from that)
      - name: Offer ledger
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: |
          gh release download data --pattern "ledger*.ndjson.gz" --dir generated --clobber || echo "no ledger yet, starting one"
      - name: Search index
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: npm run index
      # artist profiles (Refresh's enrich job, docs/sources.md): not part of the index cache, always the latest
      - name: Artist profiles
        run: |
          mkdir -p generated/enrich
          gh release download data --pattern enrich.json.gz -O - | gunzip > generated/enrich/artists.json || { echo "no profiles yet"; rm -f generated/enrich/artists.json; }
      # the collectors feed (Refresh's social job, docs/feed.md), served as /social.json
      - name: Collectors feed
        run: gh release download data --pattern social.json.gz -O - | gunzip > public/social.json || { echo "no feed yet"; rm -f public/social.json; }
      - run: npx astro build
      - name: Save the offer ledger
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: |
          files=generated/ledger.ndjson.gz
          if [ -f generated/ledger-prev.ndjson.gz ]; then files="$files generated/ledger-prev.ndjson.gz"; fi
          gh release upload data $files --clobber
      # GitHub Pages sites may be 1 GB: stop at 900 MB so a growth spike never takes the site down
      - name: Size budget
        run: |
          du -sm --apparent-size dist dist/search dist/w dist/new dist/feed 2>/dev/null || true
          test "$(du -sm --apparent-size dist | cut -f1)" -le 900
      # the built site in a browser, as readers use it: a failing test stops here, the live site keeps the previous build
      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        id: e2e
        run: npm run test:e2e
      - name: Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
      # health report: today's numbers against the last build of an earlier day (history: health.json in the
      # "data" release); one issue labelled "health" opened or updated while degraded, closed once healthy.
      # Also after a failed step (a failed test is reported), and never a reason to hold the deploy back.
      - name: Health report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release download data --pattern health.json --dir generated --clobber || echo "no health history yet"
          # the numbers are saved even when the issue can't be updated
          npm run health -- --history generated/health.json --issue || status=$?
          if [ -f generated/health.json ]; then gh release upload data generated/health.json --clobber; fi
          exit "${status:-0}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # a large site (search index + watchlist files) can take GitHub Pages over 10 min to publish
          timeout: 1800000

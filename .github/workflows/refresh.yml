# Daily: check every shop, crawl catalogs (and find new shops on the 1st of the month),
# keep the result in the "data" release, then deploy the site.
# Next to it, the site crawler reads shops without a catalog API, in shards (data/config.json
# site.shards). Each shard keeps its own release asset site-<k>.tar.gz, so no job overwrites another's.
name: Refresh

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: Also look for new shops on OpenStreetMap
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Previous crawl data
        run: gh release download data --pattern generated.tar.gz && tar xzf generated.tar.gz || echo "no previous data"
      - run: npm run validate
      - name: Discover new shops
        if: inputs.discover || github.event_name == 'schedule'
        run: |
          if [ "${{ inputs.discover }}" = "true" ] || [ "$(date -u +%d)" = "01" ]; then
            npm run discover -- --write
            npm run validate
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/shops
            git diff --cached --quiet || { git commit -m "Add shops found by the monthly discovery"; git pull --rebase; git push; }
          fi
      # a check that fails (it writes the shop states only at its end) leaves yesterday's states: the crawl
      # still runs with them, so one bad shop server never costs a day of data (the failure stays visible)
      - name: Check shops
        id: check
        continue-on-error: true
        run: npm run check
      - run: npm run crawl
      # weekly numbers in git; the commit also keeps the schedule alive (GitHub stops it after 60 idle days)
      - name: Weekly stats
        if: github.event_name == 'schedule'
        run: |
          npm run stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats
          git diff --cached --quiet || { git commit -m "Weekly data stats"; git pull --rebase; git push; }
      - name: Publish crawl data
        run: |
          tar czf generated.tar.gz generated
          gh release view data > /dev/null 2>&1 || gh release create data --title "Crawl data" --notes "Latest output of the Refresh workflow, used by Deploy."
          gh release upload data generated.tar.gz --clobber

  site-plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: echo "shards=$(node -p "JSON.stringify([...Array(require('./data/config.json').site.shards).keys()])")" >> "$GITHUB_OUTPUT"

  site:
    needs: site-plan
    runs-on: ubuntu-24.04
    # the crawler stops itself at site.maxMinutes (290) and saves its state; this is the safety net
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.site-plan.outputs.shards) }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # shop states from yesterday's check, and this shard's own crawl state
      - name: Previous data
        run: |
          gh release download data --pattern generated.tar.gz && tar xzf generated.tar.gz || echo "no previous crawl data"
          gh release download data --pattern "site-$SITE_SHARD.tar.gz" && tar xzf "site-$SITE_SHARD.tar.gz" || echo "no previous site data"
      - run: npm run site
      # also after a failure: whatever the shard saved is kept for tomorrow
      - name: Publish site data
        if: always()
        run: |
          tar czf "site-$SITE_SHARD.tar.gz" generated/site-$SITE_SHARD-*.json* "generated/products-site-$SITE_SHARD.ndjson.gz"
          gh release view data > /dev/null 2>&1 || gh release create data --title "Crawl data" --notes "Latest output of the Refresh workflow, used by Deploy." || true
          gh release upload data "site-$SITE_SHARD.tar.gz" --clobber

  # artist profiles from open sources (docs/sources.md), for the artists the live site lists: next to the crawls
  enrich:
    runs-on: ubuntu-24.04
    # the run stops itself at enrich.maxMinutes (40) and saves what it did
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Previous profiles
        run: |
          mkdir -p generated/enrich
          gh release download data --pattern enrich.json.gz -O - | gunzip > generated/enrich/artists.json || { echo "no profiles yet"; rm -f generated/enrich/artists.json; }
      - run: npm run enrich
      - name: Publish profiles
        run: |
          gzip -c generated/enrich/artists.json > enrich.json.gz
          gh release view data > /dev/null 2>&1 || gh release create data --title "Crawl data" --notes "Latest output of the Refresh workflow, used by Deploy."
          gh release upload data enrich.json.gz --clobber

  # the collectors feed (docs/feed.md): accounts that published a list, found through the Bluesky relay
  social:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Previous feed
        run: |
          mkdir -p generated
          for f in social social-state; do
            gh release download data --pattern "$f.json.gz" -O - | gunzip > "generated/$f.json" || { echo "no $f yet"; rm -f "generated/$f.json"; }
          done
      - run: npm run social
      - name: Publish the feed
        run: |
          for f in social social-state; do gzip -c "generated/$f.json" > "$f.json.gz"; done
          gh release view data > /dev/null 2>&1 || gh release create data --title "Crawl data" --notes "Latest output of the Refresh workflow, used by Deploy."
          gh release upload data social.json.gz social-state.json.gz --clobber

  # the index from today's crawl data, once (index.yml); Deploy then finds it up to date
  index:
    needs: [refresh, site]
    # a failed crawl job keeps yesterday's data asset: index in any case
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/index.yml
    permissions:
      contents: write

  deploy:
    needs: [index, enrich, social]
    # a failed job keeps yesterday's data asset: deploy in any case, so one bad job never holds the site back
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deploy.yml
    # write: Deploy saves the health history in the "data" release, and may build the index; issues: its health report
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
